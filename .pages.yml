# Pages CMS configuration — David's visual admin (app.pagescms.org).
# Nearly everything on the site is editable here:
#   • Site Settings  — business name, contact, WhatsApp, hours, top bar, menu.
#   • Homepage       — hero, value-props, section titles, "who we are", stats.
#   • Pages          — About, Delivery, Returns, Terms, Privacy (rich text).
#   • Products       — one section per department; name, price, photo, hide,
#                      description, key features and the specifications table.
# Any save commits to the repo and the site auto-rebuilds within ~2 minutes.
# NOTE: the panel's own look is Pages CMS's hosted app and can't be reskinned.

media:
  input: assets/img
  output: /assets/img
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: settings
    label: Site Settings
    description: Business name, phone, WhatsApp, email, address, opening hours, the top bar and the menu.
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: name, label: Business name, type: string }
      - { name: tagline, label: Tagline (under the logo), type: string }
      - { name: phone, label: Phone number, type: string }
      - { name: whatsapp, label: "WhatsApp number (international, no + or spaces — e.g. 353852414790)", type: string }
      - { name: email, label: Email, type: string }
      - { name: address, label: Address, type: string }
      - { name: hours, label: Opening hours, type: string }
      - { name: footer_blurb, label: Footer blurb, type: text }
      - name: topstrip
        label: Top bar messages
        type: object
        list: true
        description: The small messages in the black bar at the very top.
        fields:
          - { name: icon, label: Icon (emoji), type: string }
          - { name: bold, label: Bold part, type: string }
          - { name: text, label: Rest of the message, type: string }
      - name: nav
        label: Menu sections
        type: object
        list: true
        description: The links in the orange menu bar (Electrical / Home / Garden).
        fields:
          - { name: label, label: Label, type: string }
          - { name: link, label: Link (e.g. /category/), type: string }

  - name: homepage
    label: Homepage
    description: The hero, value-props, section headings, "who we are" text and the stats on the front page.
    type: file
    path: content/homepage.json
    format: json
    fields:
      - { name: hero_eyebrow, label: Hero — small heading, type: string }
      - { name: hero_title, label: "Hero — big headline (one line each)", type: text }
      - { name: hero_text, label: Hero — paragraph, type: text }
      - { name: hero_cta_label, label: Hero — button label, type: string }
      - { name: hero_image, label: "Hero — image (optional; leave blank for automatic)", type: image }
      - name: valueprops
        label: Value bar (delivery / in store / advice / family)
        type: object
        list: true
        fields:
          - { name: icon, label: Icon (emoji), type: string }
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
      - { name: brands_label, label: "Brands strip — heading", type: string }
      - { name: category_label, label: "Categories — small heading", type: string }
      - { name: category_title, label: "Categories — heading", type: string }
      - { name: popular_label, label: "Popular — small heading", type: string }
      - { name: popular_title, label: "Popular — heading", type: string }
      - { name: whatsapp_title, label: "WhatsApp strip — heading", type: string }
      - { name: whatsapp_text, label: "WhatsApp strip — text", type: text }
      - { name: about_label, label: "Who we are — small heading", type: string }
      - { name: about_title, label: "Who we are — heading", type: string }
      - { name: about_text, label: "Who we are — paragraph", type: text }
      - name: stats
        label: Stats row
        type: object
        list: true
        fields:
          - { name: number, label: Number, type: string }
          - { name: label, label: Label, type: string }

  - name: pages
    label: Pages (About, Delivery, etc.)
    description: The wording of About Us, Delivery, Returns, Terms and Privacy.
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - { name: title, label: Page title, type: string }
      - { name: body, label: Page content, type: rich-text }

  - name: fridges-freezers
    label: Fridges & Freezers
    description: Fridges & Freezers on the site. Search by name or model, then click Edit.
    type: collection
    path: content/products/fridges-freezers
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, sku, price, hidden]
      primary: name
      sort: [name, price, sku]
      search: [name, sku]
    fields:
      - name: name
        label: Product name
        type: string
      - name: price
        label: Price (€)
        type: string
        description: "Numbers only — e.g. 599 or 129.99. No € sign."
      - name: images
        label: Photo
        type: object
        list: true
        description: "Upload the product photo here (one is enough)."
        fields:
          - { name: src, label: Image, type: image }
      - name: hidden
        label: Hide from website
        type: boolean
        default: false
        description: "Turn on to take this off the site (e.g. sold out) without deleting it."
      - name: sku
        label: Model number
        type: string
      - name: description
        label: Description
        type: text
        description: "The paragraph under Overview. Leave blank for the automatic one."
      - name: features
        label: Key features
        type: string
        list: true
        description: "Bullet points under Overview — one per line."
      - name: specs
        label: Specifications table
        type: object
        list: true
        description: "Rows of the spec table."
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: categories
        label: Category (advanced)
        type: object
        list: true
        description: "Which section it appears in. Usually leave as-is."
        fields:
          - { name: id, label: Category ID, type: number }
          - { name: name, label: Category name, type: string }
      - { name: id, label: Internal ID (do not change), type: number }
      - { name: slug, label: URL slug (do not change), type: string }
      - { name: regular_price, label: Regular price, type: string }
      - { name: sale_price, label: Sale price, type: string }
      - { name: stock_status, label: Stock status, type: string, default: instock }

